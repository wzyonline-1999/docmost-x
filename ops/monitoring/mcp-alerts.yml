groups:
  - name: docmost-mcp
    rules:
      - alert: DocmostMcpAuditFailure
        expr: increase(docmost_mcp_audit_failures_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Docmost MCP audit persistence is failing
          description: At least one MCP audit write failed in the last five minutes.

      - alert: DocmostMcpIndexQueueBacklog
        expr: max(docmost_mcp_index_jobs{status="queued"}) > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Docmost MCP vector queue is backed up
          description: More than 100 vector jobs have remained queued for ten minutes.

      - alert: DocmostMcpIndexJobStuck
        expr: max(docmost_mcp_index_oldest_job_age_seconds{status="running"}) > 900
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Docmost MCP vector job is stuck
          description: A vector job has been running for more than fifteen minutes.

      - alert: DocmostMcpIndexFailuresPresent
        expr: max(docmost_mcp_index_jobs{status="failed"}) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Docmost MCP vector jobs need attention
          description: One or more persisted vector jobs are in failed state.

      - alert: DocmostMcpEmbeddingLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(docmost_mcp_embedding_duration_seconds_bucket[5m]))) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Docmost MCP embedding p95 is high
          description: Embedding request p95 latency has exceeded five seconds for ten minutes.

      - alert: DocmostMcpAuthenticationFailuresHigh
        expr: sum(rate(docmost_mcp_requests_total{outcome="unauthorized"}[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Docmost MCP authentication failures increased
          description: MCP is receiving more than one unauthorized request per second.

      - alert: DocmostMcpReconciliationRequired
        expr: sum(max by (status) (docmost_mcp_idempotency_records{status=~"needs_reconciliation|repair_required"})) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Docmost MCP write recovery requires attention
          description: At least one idempotent write has not converged automatically.

      - alert: DocmostMcpPersistentMetricsStale
        expr: time() - max(docmost_mcp_persistent_snapshot_timestamp_seconds) > 60
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Docmost MCP persistent metrics snapshot is stale
          description: No application replica has refreshed the shared persistent-state metrics snapshot for more than one minute.
