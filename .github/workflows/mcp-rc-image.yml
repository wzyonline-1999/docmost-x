name: Build MCP release candidate image

on:
  push:
    tags:
      - "docmost-mcp-vector-v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Local image tag stored in the artifact
        required: true
        default: 0.1.0-rc.4

permissions:
  contents: read

env:
  IMAGE_TAG: ${{ inputs.image_tag || github.ref_name }}

concurrency:
  group: mcp-rc-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build linux/amd64 image archive
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: docmost-x:${{ env.IMAGE_TAG }}
          outputs: type=docker,dest=/tmp/docmost-x-amd64.tar
          cache-from: type=gha,scope=mcp-rc-amd64
          cache-to: type=gha,scope=mcp-rc-amd64,mode=max

      - name: Compress and checksum image archive
        run: |
          gzip -9 /tmp/docmost-x-amd64.tar
          sha256sum /tmp/docmost-x-amd64.tar.gz > /tmp/docmost-x-amd64.tar.gz.sha256

      - name: Upload image archive
        uses: actions/upload-artifact@v4
        with:
          name: docmost-x-amd64-${{ env.IMAGE_TAG }}
          path: |
            /tmp/docmost-x-amd64.tar.gz
            /tmp/docmost-x-amd64.tar.gz.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
