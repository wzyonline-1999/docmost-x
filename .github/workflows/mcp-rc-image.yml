name: Build MCP release candidate image

on:
  push:
    tags:
      - "docmost-mcp-vector-v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Local image tag stored in the artifact
        required: true
        default: 0.1.0-rc.5

permissions:
  contents: read

env:
  IMAGE_TAG: ${{ inputs.image_tag || github.ref_name }}

concurrency:
  group: mcp-rc-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    permissions:
      contents: read
    uses: ./.github/workflows/mcp-quality.yml

  build:
    needs: quality
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build linux/amd64 image archive
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          tags: docmost-x:${{ env.IMAGE_TAG }}
          outputs: type=docker,dest=/tmp/docmost-x-amd64.tar
          cache-from: type=gha,scope=mcp-rc-amd64
          cache-to: type=gha,scope=mcp-rc-amd64,mode=max

      - name: Compress and checksum image archive
        run: |
          gzip -9 /tmp/docmost-x-amd64.tar
          sha256sum /tmp/docmost-x-amd64.tar.gz > /tmp/docmost-x-amd64.tar.gz.sha256

      - name: Upload image archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docmost-x-amd64-${{ env.IMAGE_TAG }}
          path: |
            /tmp/docmost-x-amd64.tar.gz
            /tmp/docmost-x-amd64.tar.gz.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.ref_type == 'tag'
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Download image archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docmost-x-amd64-${{ env.IMAGE_TAG }}
          path: /tmp/docmost-x-release

      - name: Publish prerelease image archive
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          prerelease: true
          generate_release_notes: false
          files: |
            /tmp/docmost-x-release/docmost-x-amd64.tar.gz
            /tmp/docmost-x-release/docmost-x-amd64.tar.gz.sha256
